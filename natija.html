<!doctype html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Mock natijasi</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f5f0e6;--card:#fffdf8;--ink:#1f2433;--muted:#7a7468;--line:#e6dfd0;--dark:#17333b;--g:#1f6b3a;--lime:#d9f08c;--ok:#22a35a;--no:#dc4b4b;--na:#e4e0d4;--nat:#8a8473;--acc:#e0562a}
:root[data-theme="dark"]{--bg:#15171f;--card:#1e212c;--ink:#f1ede4;--muted:#9a9686;--line:#2d3140;--na:#2f3342;--nat:#9a9686}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.hero{background:var(--dark);color:#fff;padding:16px 18px}.hero small{display:block;opacity:.7;font-size:11px;letter-spacing:.1em;text-transform:uppercase}.hero b{display:block;font-size:20px;margin-top:3px}
.wrap{max-width:560px;margin:0 auto}
.card{margin:12px;border-radius:20px;background:var(--g);color:#fff;padding:18px}
.card .a{font-size:13px;opacity:.85}.card .n{font-size:46px;font-weight:800;line-height:1.1}.card .n span{font-size:18px;opacity:.8;font-weight:700}
.bar{height:8px;border-radius:9px;background:rgba(255,255,255,.25);margin:10px 0 12px;overflow:hidden}.bar i{display:block;height:100%;background:var(--lime);border-radius:9px}
.msg{font-weight:700;color:var(--lime);margin:0 0 10px;font-size:15px}
.st{display:flex;gap:8px}.st div{flex:1;background:rgba(255,255,255,.14);border-radius:12px;padding:9px;font-size:11px}.st b{display:block;font-size:17px}
.lv{margin-top:10px;background:rgba(255,255,255,.14);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.lv .l{font-size:12px;opacity:.9}.lv .lb{font-size:30px;font-weight:800;color:var(--lime)}.lv .bl{font-size:26px;font-weight:800;color:var(--lime)}.lv .bl small{font-size:12px;color:#fff;opacity:.85;font-weight:600}
.rk{margin:0 12px;background:var(--card);border-radius:14px;padding:12px 14px;font-size:14px;border:1px solid var(--line)}
.sec{margin:16px 14px 6px;font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--muted)}
.lg{margin:0 14px 8px;font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}.lg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin:0 12px}
.g button{height:40px;border:0;border-radius:10px;color:#fff;font:800 14px system-ui;cursor:pointer;padding:0}
.g .s-c{background:var(--ok)}.g .s-x{background:var(--no)}.g .s-n{background:var(--na);color:var(--nat)}.g .s-p{background:linear-gradient(135deg,var(--ok) 50%,var(--no) 50%)}
.g button.sel{outline:3px solid #e8c53a;outline-offset:1px}
.dt{margin:12px;background:var(--card);border-radius:16px;padding:14px;border:1px solid var(--line);font-size:14px;min-height:92px}
.dt h4{margin:0 0 8px;font-size:15px}.dt .r{display:flex;justify-content:space-between;align-items:center;padding:4px 0;gap:10px}
.tag{border-radius:8px;padding:1px 8px;font-size:12px;font-weight:700;margin-left:6px}.tx{background:#fde3e3;color:#b3261e}.tc{background:#dff2ea;color:#1b7a50}.tn{background:var(--line);color:var(--muted)}
.note{margin:6px 14px;font-size:12px;color:var(--muted);text-align:center}
.qt{white-space:pre-wrap;font-size:14px;line-height:1.45;margin:0 0 10px;padding-bottom:10px;border-bottom:1px solid var(--line);max-height:46vh;overflow:auto}.sol{margin-top:10px;padding:8px 10px;border-radius:10px;background:var(--line);font-size:13px;color:var(--ink)}.opt{padding:7px 10px;border-radius:10px;margin:4px 0;border:1px solid var(--line);font-size:14px;line-height:1.4}.opt.ok{background:#dff2ea;border-color:#22a35a;color:#14633c;font-weight:700}.opt.no{background:#fde3e3;border-color:#dc4b4b;color:#8f1d17;font-weight:700}.sol a{color:#1a73c8;font-weight:700;text-decoration:underline}.mis{font-weight:700;margin:2px 0 6px}
.err{margin:30px 18px;text-align:center;color:var(--muted)}
</style></head><body>
<div class="hero"><small>Biologiya Tayyorlov Kursi</small><b id="ttl">Mock natijasi</b></div>
<div class="wrap" id="root"></div>
<script>
(function(){
  var tg=window.Telegram&&Telegram.WebApp;
  if(tg){try{tg.ready();tg.expand();document.documentElement.setAttribute('data-theme',tg.colorScheme==='dark'?'dark':'light');}catch(e){}}
  try{if(tg&&history.length>1&&tg.BackButton){tg.BackButton.show();tg.BackButton.onClick(function(){history.back();});}}catch(e){}
  function ok(e){var t=e.target;return t&&t.closest&&t.closest('input,textarea');}
  ['contextmenu','copy','cut','dragstart','selectstart'].forEach(function(ev){document.addEventListener(ev,function(e){if(!ok(e))e.preventDefault();},true);});
  var root=document.getElementById('root');
  function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e;}
  var D=null;
  try{
    var h=(location.hash||'').replace(/^#/,'').replace(/-/g,'+').replace(/_/g,'/');
    while(h.length%4)h+='=';
    var bin=atob(h),u8=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
    D=JSON.parse(new TextDecoder('utf-8').decode(u8));
  }catch(e){D=null;}
  if(!D||!D.s){root.appendChild(el('div','err','Natijani o‘qib bo‘lmadi. Botdagi tugmani qaytadan bosing.'));return;}
  document.getElementById('ttl').textContent='Mock '+D.m+' · Natija';
  var pct=D.tt?D.ok/D.tt:0;
  var motiv=pct>=.85?'🌟 Ajoyib natija! Shunday davom eting.':pct>=.65?'💪 Zo‘r natija! Yana bir oz — va yuqori daraja.':pct>=.4?'🌱 Yaxshi boshlanish. Xatolaringiz ustida ishlang.':'📚 Har bir test — bir qadam oldinga. Xatolarni o‘rganing!';
  function fmtT(s){if(!s)return '—';var h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h+':'+(m<10?'0':'')+m;}
  var card=el('div','card');
  card.appendChild(el('div','a','To‘g‘ri javoblar'));
  var n=el('div','n',String(D.ok));n.appendChild(el('span','',' / '+D.tt));card.appendChild(n);
  var bar=el('div','bar'),bi=el('i');bi.style.width=Math.round(pct*100)+'%';bar.appendChild(bi);card.appendChild(bar);
  card.appendChild(el('div','msg',motiv));
  var st=el('div','st');
  [[D.ts[0]+'/35','1–35 test'],[D.ts[1]+'/5','36–40 qisqa'],[D.ts[2]+'/'+D.ts[3],'41–43 katak'],[fmtT(D.e),'vaqt']].forEach(function(x){var d=el('div');d.appendChild(el('b','',x[0]));d.appendChild(document.createTextNode(x[1]));st.appendChild(d);});
  card.appendChild(st);
  var lv=el('div','lv');
  lv.appendChild(el('div','l',D.lv?'Daraja':'Daraja yo‘q'));
  lv.appendChild(el('div','lb',D.lv||'—'));
  var bl=el('div','bl',(D.p?'~':'')+D.b+' ');bl.appendChild(el('small','',D.p?'taxminiy ball':'ball'));lv.appendChild(bl);
  card.appendChild(lv);
  root.appendChild(card);
  if(D.r){var rk=el('div','rk');rk.appendChild(document.createTextNode('🏆 Shu mock bo‘yicha o‘rningiz: '));rk.appendChild(el('b','',D.r[0]+' / '+D.r[1]));root.appendChild(rk);}
  if(D.f===0)root.appendChild(el('div','note','Bu qayta urinish — reytingga kirmaydi.'));
  root.appendChild(el('div','sec','SAVOLLAR XARITASI'));
  var lg=el('div','lg');[['var(--ok)','to‘g‘ri'],['var(--no)','xato'],['var(--na)','javobsiz']].forEach(function(x){var s=el('span');var i=el('i');i.style.background=x[0];s.appendChild(i);s.appendChild(document.createTextNode(x[1]));lg.appendChild(s);});
  root.appendChild(lg);
  var grid=el('div','g');root.appendChild(grid);
  var dt=el('div','dt');root.appendChild(dt);
  function sol(){var d=el('div','sol','To‘liq yechim kerak bo‘lsa, ustoz bilan bog‘laning: ');var a=el('a','','@Akhtamova_Nigora');a.href='https://t.me/Akhtamova_Nigora';a.onclick=function(e){e.preventDefault();var u='https://t.me/Akhtamova_Nigora';try{if(tg&&tg.openTelegramLink){tg.openTelegramLink(u);return;}}catch(x){}window.open(u,'_blank');};d.appendChild(a);return d;}
  var btns=[],QT=null,cur=0;
  try{fetch('m/'+encodeURIComponent(D.m)+'/q.json').then(function(r){return r.ok?r.json():null;}).then(function(j){if(j){QT=j;show(cur);}}).catch(function(){});}catch(e){}
  function show(i){
    cur=i;
    btns.forEach(function(b,k){b.classList.toggle('sel',k===i);});
    dt.innerHTML='';
    dt.appendChild(el('h4','',(i+1)+'-savol'));
    if(QT&&QT[String(i+1)]){
      var txt=QT[String(i+1)],ln=txt.split('\n'),ai=-1;
      for(var z=0;z<ln.length;z++){if(/^A\)\s/.test(ln[z])){ai=z;break;}}
      var opts=[],stem=txt;
      if(i<35&&ai>=0){
        var rest=ln.slice(ai).join(' '),pos=[],from=0,L='ABCDEF';
        for(var q=0;q<6;q++){var m=rest.indexOf(L.charAt(q)+') ',from);if(m<0||(m>0&&rest.charAt(m-1)!==' '))break;pos.push(m);from=m+3;}
        if(pos.length>=2){
          stem=ln.slice(0,ai).join('\n');
          for(var q=0;q<pos.length;q++)opts.push([L.charAt(q),rest.slice(pos[q],q+1<pos.length?pos[q+1]:undefined).trim()]);
        }
      }
      dt.appendChild(el('div','qt',stem));
      var kc=typeof D.k[i]==='string'?D.k[i].toUpperCase():'',uc=typeof D.u[i]==='string'?D.u[i].toUpperCase():'';
      opts.forEach(function(o){
        var c=o[0]===kc?'ok':(o[0]===uc&&s!=='c'?'no':'');
        dt.appendChild(el('div','opt '+c,(c==='ok'?'✅ ':c==='no'?'❌ ':'')+o[1]));
      });
    }
    function row(l,v,tag){var r=el('div','r');r.appendChild(el('span','',l));var b=el('b','',v||'—');if(tag){var t=el('span','tag '+tag[0],tag[1]);b.appendChild(t);}r.appendChild(b);dt.appendChild(r);}
    var s=D.s[i];
    if(i<40){
      var tag=s==='c'?['tc','to‘g‘ri']:s==='n'?['tn','javobsiz']:['tx','xato'];
      if(s==='x')dt.appendChild(el('div','mis','❌ '+(D.u[i]||'—')+'  →  ✅ '+D.k[i]));
      row('Sizning javobingiz',D.u[i],tag);
      row('To‘g‘ri javob',D.k[i]);
      if(i>=35)dt.appendChild(sol());
    }else{
      var us=D.u[i]||[],ks=D.k[i]||[];
      var tag2=s==='c'?['tc','yechildi']:s==='p'?['tx','qisman']:s==='n'?['tn','javobsiz']:['tx','xato'];
      row('Natija','',tag2);
      for(var c=0;c<ks.length;c++){
        var g=us[c]||'';var good=g&&String(g).replace(/[\s%]/g,'').replace(',','.')===String(ks[c]).replace(/[\s%]/g,'').replace(',','.');
        row('abcd'.charAt(c)+') sizniki',g,g?(good?['tc','✓']:['tx','xato']):['tn','—']);
        row('abcd'.charAt(c)+') to‘g‘ri',ks[c]);
      }
      dt.appendChild(sol());
    }
  }
  for(var i=0;i<D.s.length;i++){
    (function(i){var b=el('button','s-'+D.s[i],String(i+1));b.type='button';b.onclick=function(){show(i);};grid.appendChild(b);btns.push(b);})(i);
  }
  var first=D.s.indexOf('x');if(first<0)first=D.s.indexOf('p');show(first<0?0:first);
  root.appendChild(el('div','note','Katakni bosing — javobingiz va to‘g‘ri javob chiqadi.'));
})();
</script></body></html>
