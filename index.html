<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Javoblar varag'i</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#f5f0e6; --card:#fffdf8; --ink:#1f2433; --muted:#7a7468; --line:#e6dfd0;
  --accent:#e0562a; --accent-ink:#fff; --soft:#fbe6dc; --ok:#2a8a6e; --warn:#c0392b;
  --bubble:#fff; --shadow:0 1px 0 rgba(31,36,51,.04),0 6px 18px rgba(80,60,20,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171f; --card:#1e212c; --ink:#f1ede4; --muted:#9a9686; --line:#2d3140;
    --accent:#ff7a4d; --accent-ink:#1b1209; --soft:#3a2a24; --ok:#4fc3a1; --warn:#ff7a6b;
    --bubble:#262a38; --shadow:0 6px 18px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#15171f; --card:#1e212c; --ink:#f1ede4; --muted:#9a9686; --line:#2d3140;
  --accent:#ff7a4d; --accent-ink:#1b1209; --soft:#3a2a24; --ok:#4fc3a1; --warn:#ff7a6b;
  --bubble:#262a38; --shadow:0 6px 18px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(110px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{margin:0;font-size:20px;letter-spacing:-.2px}
h1 small{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.4px;text-transform:uppercase}
.count{font-weight:700;font-size:14px;background:var(--soft);color:var(--accent);padding:6px 12px;border-radius:999px;white-space:nowrap}
.bar{height:5px;background:var(--line);border-radius:9px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:9px;transition:width .25s}
main{padding:14px 16px;max-width:560px;margin:0 auto}
.sec{margin:18px 0 8px;display:flex;align-items:baseline;gap:8px}
.sec b{font-size:13px;letter-spacing:.8px;text-transform:uppercase;color:var(--accent)}
.sec span{font-size:12px;color:var(--muted)}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:6px 14px}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.n{width:30px;font-weight:700;font-size:15px;color:var(--muted);text-align:right;flex:none}
.opts{display:flex;gap:10px;flex:1;justify-content:space-between;max-width:290px}
.o{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--bubble);color:var(--muted);
  font:700 15px system-ui;display:grid;place-items:center;cursor:pointer;transition:transform .08s,background .15s,border-color .15s;padding:0}
.o:active{transform:scale(.9)}
.o.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 3px 10px rgba(224,86,42,.35)}
.six .opts{gap:6px}
.six .o{width:38px;height:38px;font-size:14px}
.rowx{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.rowx:last-child{border-bottom:0}
input.t{flex:1;min-width:0;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--bubble);color:var(--ink);
  font:600 17px system-ui;padding:0 12px;outline:0}
input.t:focus{border-color:var(--accent)}
input.t.has{border-color:var(--accent)}
.w{padding:12px 0;border-bottom:1px dashed var(--line)}
.w:last-child{border-bottom:0}
.wh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.wh b{font-size:15px}
.wh i{font-style:normal;font-size:12px;color:var(--muted)}
.cell{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.cell em{font-style:normal;width:26px;height:26px;border-radius:8px;background:var(--soft);color:var(--accent);font-weight:800;font-size:13px;display:grid;place-items:center;flex:none}
.ctl{display:flex;gap:8px}
.ctl button{height:38px;min-width:46px;border-radius:12px;border:0;font:800 20px system-ui;cursor:pointer;color:#fff}
.ctl .add{background:var(--ok)} .ctl .del{background:var(--warn)}
.ctl button:disabled{opacity:.3}
footer{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--bg) 70%,transparent)}
#send{display:block;width:100%;max-width:560px;margin:0 auto;height:54px;border:0;border-radius:16px;background:var(--accent);
  color:var(--accent-ink);font:800 17px system-ui;letter-spacing:.2px;cursor:pointer;box-shadow:0 8px 22px rgba(224,86,42,.35)}
#send:active{transform:scale(.98)}
.ov{position:fixed;inset:0;background:rgba(10,10,20,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
.ov.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:22px 18px calc(20px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 6px;font-size:19px}
.sheet p{margin:0 0 16px;color:var(--muted)}
.btns{display:flex;gap:10px}
.btns button{flex:1;height:50px;border-radius:14px;border:0;font:700 16px system-ui;cursor:pointer}
.b1{background:var(--accent);color:var(--accent-ink)} .b2{background:var(--soft);color:var(--accent)}
#dbg{white-space:pre-wrap;word-break:break-all;font:12px monospace;background:var(--card);padding:10px;border-radius:12px;margin-top:14px;display:none}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1><small>Javoblar varag'i</small><span id="ttl">Mock</span></h1>
    <div class="count" id="cnt">0 / 40</div>
  </div>
  <div class="bar"><i id="bar"></i></div>
</header>
<main>
  <div class="sec"><b>Test</b><span>1–32 · bitta javob (A–D)</span></div>
  <div class="card" id="s1"></div>
  <div class="sec"><b>Moslashtirish</b><span>33–35 · bitta javob (A–F)</span></div>
  <div class="card six" id="s2"></div>
  <div class="sec"><b>Qisqa javob</b><span>36–40 · raqam yozing (3,6 yoki 3.6)</span></div>
  <div class="card" id="s3"></div>
  <div class="sec"><b>Yozma ish</b><span>41–43 · har bir javobga alohida katak</span></div>
  <div class="card" id="s4"></div>
  <div id="dbg"></div>
</main>
<footer><button id="send" type="button">Yuborish ✈️</button></footer>

<div class="ov" id="ov"><div class="sheet">
  <h2 id="ovT">Yuborishga tayyormisiz?</h2><p id="ovP"></p>
  <div class="btns"><button class="b2" id="back" type="button">Tekshirib chiqaman</button><button class="b1" id="go" type="button">Yuborish</button></div>
</div></div>

<script>
(function(){
  var tg = window.Telegram && window.Telegram.WebApp;
  var q = new URLSearchParams(location.search);
  var M = parseInt(q.get('m'), 10) || 0;
  var KEY = 'mock_draft_' + M;
  document.getElementById('ttl').textContent = M ? 'Mock ' + M : 'Mock';
  if (tg) {
    try { tg.ready(); tg.expand(); if (tg.colorScheme) document.documentElement.setAttribute('data-theme', tg.colorScheme === 'dark' ? 'dark' : 'light'); } catch (e) {}
  }

  var st = { a: new Array(35).fill(''), n: ['', '', '', '', ''], w: [[''], [''], ['']] };
  try { var d = JSON.parse(localStorage.getItem(KEY) || 'null'); if (d && d.a && d.n && d.w) st = d; } catch (e) {}
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
  function $(id){ return document.getElementById(id); }

  function bubbles(i, letters){
    var h = '<div class="opts">';
    for (var k = 0; k < letters.length; k++) {
      h += '<button type="button" class="o' + (st.a[i] === letters[k] ? ' on' : '') + '" data-i="' + i + '" data-v="' + letters[k] + '">' + letters[k] + '</button>';
    }
    return h + '</div>';
  }
  function buildTests(){
    var h = '', i;
    for (i = 0; i < 32; i++) h += '<div class="row"><div class="n">' + (i + 1) + '</div>' + bubbles(i, 'ABCD') + '</div>';
    $('s1').innerHTML = h;
    h = '';
    for (i = 32; i < 35; i++) h += '<div class="row"><div class="n">' + (i + 1) + '</div>' + bubbles(i, 'ABCDEF') + '</div>';
    $('s2').innerHTML = h;
  }
  function buildNums(){
    var h = '';
    for (var j = 0; j < 5; j++) h += '<div class="rowx"><div class="n">' + (36 + j) + '</div><input class="t' + (st.n[j] ? ' has' : '') + '" data-n="' + j + '" inputmode="decimal" autocomplete="off" maxlength="20" placeholder="Javob" value="' + esc(st.n[j]) + '"></div>';
    $('s3').innerHTML = h;
  }
  function esc(s){ return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }
  function buildW(){
    var h = '';
    for (var k = 0; k < 3; k++) {
      var cells = st.w[k], c;
      h += '<div class="w"><div class="wh"><b>' + (41 + k) + '-masala</b><i>' + cells.length + ' ta javob</i></div>';
      for (c = 0; c < cells.length; c++) {
        h += '<div class="cell"><em>' + 'ABCD'[c] + '</em><input class="t' + (cells[c] ? ' has' : '') + '" data-k="' + k + '" data-c="' + c + '" inputmode="decimal" autocomplete="off" maxlength="30" placeholder="Javob" value="' + esc(cells[c]) + '"></div>';
      }
      h += '<div class="ctl"><button type="button" class="add" data-k="' + k + '"' + (cells.length >= 4 ? ' disabled' : '') + '>+</button>' +
           '<button type="button" class="del" data-k="' + k + '"' + (cells.length <= 1 ? ' disabled' : '') + '>–</button></div></div>';
    }
    $('s4').innerHTML = h;
  }
  function counts(){
    var a = st.a.filter(Boolean).length, n = st.n.filter(function(x){ return x.trim(); }).length;
    var w = st.w.filter(function(c){ return c.some(function(x){ return x.trim(); }); }).length;
    return { a: a, n: n, w: w, done: a + n + w, total: 35 + 5 + 3 };
  }
  function refresh(){
    var c = counts();
    $('cnt').textContent = c.done + ' / ' + c.total;
    $('bar').style.width = Math.round(c.done * 100 / c.total) + '%';
  }

  document.addEventListener('click', function(e){
    var t = e.target.closest('button'); if (!t) return;
    if (t.classList.contains('o')) {
      var i = +t.dataset.i, v = t.dataset.v;
      st.a[i] = st.a[i] === v ? '' : v;
      var sib = t.parentNode.children;
      for (var s = 0; s < sib.length; s++) sib[s].classList.toggle('on', sib[s].dataset.v === st.a[i]);
      save(); refresh();
    } else if (t.classList.contains('add')) {
      var k = +t.dataset.k; if (st.w[k].length < 4) { st.w[k].push(''); save(); buildW(); refresh(); }
    } else if (t.classList.contains('del')) {
      var k2 = +t.dataset.k; if (st.w[k2].length > 1) { st.w[k2].pop(); save(); buildW(); refresh(); }
    }
  });
  document.addEventListener('input', function(e){
    var t = e.target; if (!t.classList.contains('t')) return;
    var v = t.value.replace(/[^0-9.,\-+\/%a-zA-Z\s]/g, '');
    if (v !== t.value) t.value = v;
    t.classList.toggle('has', !!v.trim());
    if (t.dataset.n !== undefined) st.n[+t.dataset.n] = v;
    else st.w[+t.dataset.k][+t.dataset.c] = v;
    save(); refresh();
  });

  function payload(){
    var w = st.w.map(function(c){ var x = c.map(function(s){ return s.trim(); }); while (x.length && !x[x.length - 1]) x.pop(); return x; });
    return { v: 1, m: M, a: st.a.map(function(x){ return x || '-'; }).join(''), n: st.n.map(function(s){ return s.trim(); }), w: w };
  }
  function ask(){
    var c = counts(), left = (35 - c.a) + (5 - c.n) + (3 - c.w);
    $('ovT').textContent = left ? 'Hali javob berilmagan joylar bor' : 'Yuborishga tayyormisiz?';
    $('ovP').textContent = left ? ('Belgilanmagan: ' + left + ' ta. Yuborsangiz, ular xato hisoblanadi.') : 'Yuborgandan so\'ng natijangiz botda ko\'rinadi.';
    $('ov').classList.add('show');
  }
  $('send').addEventListener('click', ask);
  $('back').addEventListener('click', function(){ $('ov').classList.remove('show'); });
  $('go').addEventListener('click', function(){
    $('ov').classList.remove('show');
    var p = JSON.stringify(payload());
    if (tg && tg.sendData) { try { localStorage.removeItem(KEY); } catch (e) {} tg.sendData(p); }
    else { var d = $('dbg'); d.style.display = 'block'; d.textContent = 'Telegramdan tashqarida ochilgan. Yuboriladigan ma\'lumot:\n' + p; d.scrollIntoView(); }
  });

  buildTests(); buildNums(); buildW(); refresh();
})();
</script>
</body>
</html>
